<h1>🏏 IPL Team Voting App</h1>

<div id="teams"></div>

<script>
    const teams = [
        "Mumbai Indians",
        "Chennai Super Kings",
        "Royal Challengers Bengaluru",
        "Kolkata Knight Riders",
        "Delhi Capitals",
        "Rajasthan Royals",
        "Sunrisers Hyderabad",
        "Punjab Kings",
        "Lucknow Super Giants",
        "Gujarat Titans"
    ];

    async function loadResults() {
        const response = await fetch('/results');
        const data = await response.json();

        const voteMap = {};
        data.leaderboard.forEach(team => {
            voteMap[team.team] = team.votes;
        });

        const container = document.getElementById('teams');
        container.innerHTML = '';

        teams.forEach(team => {
            container.innerHTML += `
                <div class="team-card">
                    <div>
                        <h3>${team}</h3>
                        <span class="votes">Votes: ${voteMap[team] || 0}</span>
                    </div>
                    <button onclick="voteTeam('${team}')">
                        Vote
                    </button>
                </div>
            `;
        });
    }

    async function voteTeam(team) {
        const teamSlug = team.toLowerCase().replaceAll(' ', '-');

        await fetch(`/vote/${teamSlug}`, {
            method: 'POST'
        });

        loadResults();
    }

    loadResults();
</script>
```
